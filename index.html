<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Mayu · Mayu Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0714;
    --bg2:#150a2b;
    --violet-deep:#3a0f8f;
    --violet-mid:#6d28d9;
    --violet-bright:#8b5cf6;
    --blue:#3b82f6;
    --fuchsia:#d946ef;
    --cyan:#22d3ee;
    --gold:#facc15;
    --white:#ffffff;
    --ink:#0b0714;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  html{ background:var(--bg); }

  body{
    background:var(--bg);
    font-family:'Manrope', sans-serif;
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    isolation:isolate;
  }

  /* ---------------- ANIMATED BACKGROUND ---------------- */
  .bg-fx{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
      radial-gradient(circle at 50% 100%, #200a4a 0%, var(--bg) 60%);
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    animation:drift 16s ease-in-out infinite;
  }
  .blob.b1{ width:280px; height:280px; background:var(--violet-mid); top:-80px; left:-60px; animation-delay:0s; }
  .blob.b2{ width:240px; height:240px; background:var(--fuchsia); top:120px; right:-90px; animation-delay:-5s; }
  .blob.b3{ width:260px; height:260px; background:var(--cyan); bottom:60px; left:-100px; opacity:0.28; animation-delay:-9s; }
  .blob.b4{ width:220px; height:220px; background:var(--violet-deep); bottom:-100px; right:-60px; animation-delay:-3s; }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-25px) scale(1.12); }
  }

  .dot-field{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(216,180,254,0.4) 1px, transparent 1.4px);
    background-size:18px 18px;
    opacity:0.16;
    mask-image:linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
  }

  /* ---------------- HERO / LOGO ---------------- */
  .hero{
    position:relative;
    padding:36px 0 10px;
    text-align:center;
  }

  .logo-glow-wrap{
    position:relative;
    display:block;
    width:100%;
  }

  .m-outline{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .m-base{
    fill:none;
    stroke:rgba(255,255,255,0.14);
    stroke-width:1.6;
  }

  .m-comet{
    fill:none;
    stroke:url(#mGrad);
    stroke-width:2.6;
    stroke-linecap:round;
    filter:url(#mGlow);
    stroke-dasharray:14 100;
    animation:mTravel 3.6s linear infinite;
  }

  .m-comet.p2{ animation-delay:-1.8s; }

  @keyframes mTravel{
    from{ stroke-dashoffset:100; }
    to{ stroke-dashoffset:-14; }
  }

  .logo-img{
    width:100%;
    max-width:480px;
    height:auto;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,0.4));
  }

  /* ---------------- CTA SECTION ---------------- */
  .cta-section{
    padding:52px 20px 10px;
    text-align:center;
  }

  .cta-title{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.4;
    margin-bottom:20px;
  }

  .cta-title .accent{
    background:linear-gradient(135deg, var(--cyan), var(--fuchsia));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .wa-button{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    background:linear-gradient(180deg, #ffffff, #f1ecff);
    border-radius:16px;
    padding:16px 18px;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.8);
    animation:floatBtn 5s ease-in-out infinite;
  }

  .wa-button:nth-child(1){ animation-delay:0s; }
  .wa-button:nth-child(2){ animation-delay:-1.6s; }
  .wa-button:nth-child(3){ animation-delay:-3.2s; }
  .wa-button:nth-child(4){ animation-delay:-2.4s; }

  @keyframes floatBtn{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }

  .wa-button:active{ transform:scale(0.96); }

  .wa-button.glow-cyan{
    padding:19px 18px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #ecfeff) padding-box,
      linear-gradient(135deg, #67e8f9, var(--cyan), #0891b2) border-box;
    box-shadow:0 14px 30px rgba(34,211,238,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button.glow-blue{
    padding:19px 18px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #eff6ff) padding-box,
      linear-gradient(135deg, #93c5fd, var(--blue), #1d4ed8) border-box;
    box-shadow:0 14px 30px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button.glow-violet{
    padding:19px 18px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #f1ecff) padding-box,
      linear-gradient(135deg, var(--cyan), var(--violet-bright), var(--fuchsia)) border-box;
    box-shadow:0 14px 30px rgba(139,92,246,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button.glow-fuchsia{
    padding:19px 18px;
    border:2px solid transparent;
    background:
      linear-gradient(180deg, #ffffff, #fdf4ff) padding-box,
      linear-gradient(135deg, #f0abfc, var(--fuchsia), #a21caf) border-box;
    box-shadow:0 14px 30px rgba(217,70,239,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .wa-button::after{
    content:'';
    position:absolute;
    top:0; left:-120%;
    width:50%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.9), transparent);
    transform:skewX(-20deg);
    animation:btnShine 3.2s ease-in-out infinite;
  }

  .wa-button:nth-child(1)::after{ animation-delay:0.3s; }
  .wa-button:nth-child(2)::after{ animation-delay:1.1s; }
  .wa-button:nth-child(3)::after{ animation-delay:1.9s; }
  .wa-button:nth-child(4)::after{ animation-delay:2.7s; }

  @keyframes btnShine{
    0%{ left:-120%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }

  .wa-icon-wrap{
    position:relative;
    width:42px;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wa-icon-wrap::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    opacity:0.35;
    animation:ringPulse 2.2s ease-out infinite;
  }

  .glow-cyan .wa-icon-wrap::before{ background:var(--cyan); }
  .glow-blue .wa-icon-wrap::before{ background:var(--blue); }
  .glow-violet .wa-icon-wrap::before{ background:var(--violet-bright); }
  .glow-fuchsia .wa-icon-wrap::before{ background:var(--fuchsia); }

  .wa-icon{
    position:relative;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(10,6,20,0.9);
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
  }

  .wa-icon svg{ width:26px; height:26px; color:#ffffff; }

  .glow-cyan .wa-icon{
    border-color:#67e8f9;
    background:radial-gradient(circle at 32% 28%, rgba(34,211,238,0.55), rgba(10,6,20,0.92));
    box-shadow:0 0 10px rgba(34,211,238,0.55);
  }

  .glow-blue .wa-icon{
    border-color:#93c5fd;
    background:radial-gradient(circle at 32% 28%, rgba(59,130,246,0.55), rgba(10,6,20,0.92));
    box-shadow:0 0 10px rgba(59,130,246,0.55);
  }

  .glow-violet .wa-icon{
    border-color:var(--violet-bright);
    background:radial-gradient(circle at 32% 28%, rgba(139,92,246,0.55), rgba(10,6,20,0.92));
    box-shadow:0 0 10px rgba(139,92,246,0.55);
  }

  .glow-fuchsia .wa-icon{
    border-color:var(--fuchsia);
    background:radial-gradient(circle at 32% 28%, rgba(217,70,239,0.55), rgba(10,6,20,0.92));
    box-shadow:0 0 10px rgba(217,70,239,0.55);
  }

  @keyframes ringPulse{
    0%{ transform:scale(0.9); opacity:0.5; }
    70%{ transform:scale(1.6); opacity:0; }
    100%{ transform:scale(1.6); opacity:0; }
  }

  .btn-text{ text-align:left; flex:1; }

  .btn-title{
    font-family:'Unbounded', sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:0.3px;
    line-height:1.1;
  }

  .btn-sub{
    font-size:11.5px;
    color:#5b21b6;
    font-weight:700;
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px;
  }

  .btn-sub .live-dot{
    width:6px; height:6px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 6px #22c55e;
    animation:blink 1.4s ease-in-out infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .btn-arrow{
    font-size:20px;
    color:#a78bfa;
    animation:arrowNudge 1.6s ease-in-out infinite;
  }

  @keyframes arrowNudge{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(4px); }
  }

  /* ---------------- FOOTER ---------------- */
  .footer{
    text-align:center;
    padding:38px 24px 46px;
  }

  .footer-rule{
    width:60px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, var(--cyan), var(--fuchsia));
    margin:0 auto 16px;
  }

  .footer-badge{
    display:inline-flex;
    align-items:center;
    padding:14px 26px 9px;
    border-radius:16px;
    background:
      linear-gradient(160deg, rgba(15,8,28,0.95), rgba(10,5,20,0.95)) padding-box,
      linear-gradient(135deg, var(--cyan), var(--violet-bright), var(--fuchsia)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 10px 28px rgba(139,92,246,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .footer-badge-text{
    position:relative;
    display:inline-block;
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:29px;
    line-height:1;
    letter-spacing:0.2px;
    text-transform:uppercase;
    transform:skewX(-6deg);
    white-space:nowrap;
  }

  .badge-stroke-layer{
    position:absolute;
    inset:0;
    filter:blur(0.6px);
    z-index:0;
  }

  .badge-fill-layer{
    position:relative;
    z-index:1;
  }

  .badge-stroke-layer .w{ color:transparent; -webkit-text-stroke:3px rgba(139,92,246,0.85); }
  .badge-stroke-layer .v{ color:transparent; -webkit-text-stroke:3px rgba(255,255,255,0.75); }

  .badge-fill-layer .w{
    color:#ffffff;
    text-shadow:
      0 0 6px rgba(139,92,246,0.85),
      0 0 16px rgba(124,58,237,0.6),
      0 0 28px rgba(124,58,237,0.35);
  }

  .badge-fill-layer .v{
    color:#e9d5ff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.7),
      0 0 16px rgba(217,70,239,0.85),
      0 0 30px rgba(139,92,246,0.5);
  }

  .footer-features{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:18px;
  }

  .footer-feature{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14.5px;
    font-weight:800;
    color:var(--white);
    letter-spacing:0.3px;
  }

  .footer-feature svg{
    width:15px;
    height:15px;
    flex-shrink:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>

</div>

<script>
  // ---- Configuración ----
  // Pegá acá la URL de tu Apps Script (termina en /exec)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7xPGxeGXtE493h2N5NZss2-rSEyNtYZE1QgpahEE2IT9GTCmKkcPDsH9qf8Fho7Q5KA/exec";

  // Mismo orden que en Code.gs (LINES)
  const lines = [
    "5491165864984",
    "5491125044104",
    "5493518192911",
    "5491123799500"
  ];

  // Nombre de cada plataforma (se inserta en las variantes de mensaje)
  const platformNames = {
    bet30:        "BET30",
    ganamos:      "GANAMOS",
    mayuplay:     "STARGAME",
    plataforma4:  "THOR"
  };

  // Variantes de mensaje: se elige una al azar en cada clic, para que no
  // todos los visitantes manden el mismo texto (evita que WhatsApp lo
  // marque como spam por repetición).
  const messageTemplates = [
    "Hola! Quiero cargar en {plataforma}",
    "Quiero un usuario en {plataforma}",
    "Me armás porfa un usuario en {plataforma}?",
    "Quiero jugar en {plataforma}, mi nombre es ",
    "Hola, vengo por {plataforma} 👋 ¿Me armás usuario?",
    "Buenas, quiero jugar en {plataforma}",
    "Me hacés un usuario en {plataforma}, dale?",
    "Hola, para cargar en {plataforma}",
    "Quiero probar en {plataforma}",
    "Hola, me pasás los datos para jugar en {plataforma}?"
  ];

  function pickMessage(key){
    const template = messageTemplates[Math.floor(Math.random() * messageTemplates.length)];
    return template.replace('{plataforma}', platformNames[key]);
  }

  // Contadores en memoria local — arrancan en 0 y se actualizan apenas
  // carga la página (sin bloquear nada) y de forma optimista en cada clic
  let localCounts = [0, 0, 0, 0];
  let countsReady = false;

  // Al cargar la página: pedimos los contadores reales en segundo plano.
  // Esto NO bloquea nada, el usuario puede clickear antes de que responda
  // (en ese caso arrancamos desde [0,0,0], que reparte igual de bien).
  fetch(`${APPS_SCRIPT_URL}?action=counts`)
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        localCounts = data.counts;
        countsReady = true;
      }
    })
    .catch(() => { /* seguimos con [0,0,0] si falla */ });

  function pickLineIndex(){
    let minIndex = 0;
    for (let i = 1; i < localCounts.length; i++){
      if (localCounts[i] < localCounts[minIndex]) minIndex = i;
    }
    return minIndex;
  }

  function buildLink(number, message){
    return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
  }

  function handleClick(event, key){
    event.preventDefault();

    // 1) Decisión instantánea, sin red — 0ms
    const idx = pickLineIndex();
    const number = lines[idx];
    const link = buildLink(number, pickMessage(key));

    // 2) Redirige ya mismo
    window.open(link, '_blank', 'noopener');

    // 3) Actualiza el contador local al toque, para que el próximo
    //    clic (aunque sea del mismo visitante) también balancee bien
    localCounts[idx] += 1;

    // 4) Avisa al backend en segundo plano, sin esperar respuesta
    //    ni bloquear al usuario. Si falla, no pasa nada grave.
    fetch(`${APPS_SCRIPT_URL}?action=increment&line=${idx}`).catch(() => {});
  }

  document.getElementById('btn-bet30').addEventListener('click', (e) => handleClick(e, 'bet30'));
  document.getElementById('btn-ganamos').addEventListener('click', (e) => handleClick(e, 'ganamos'));
  document.getElementById('btn-mayuplay').addEventListener('click', (e) => handleClick(e, 'mayuplay'));
  document.getElementById('btn-plataforma4').addEventListener('click', (e) => handleClick(e, 'plataforma4'));
</script>
